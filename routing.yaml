# WhatsApp group directory for pebble presses + the `wa` CLI.
# Read FRESH on every use - edits take effect immediately, no restart.
# The LLM sees aliases + descriptions only; JIDs never enter a prompt.

intake_chat_id: "000000000000000000@g.us"

routes:
  car:
    chat_id: "000000000000000000@g.us"
    description: "Hyundai Santa Fe: service, tires, oil, dealership, Bluelink, car stuff"
  pickleball:
    chat_id: "000000000000000000@g.us"
    description: "Pickleball: paddles (Franklin X40), tournaments, courts, gear deals"
  finance:
    chat_id: "000000000000000000@g.us"
    description: "Money: stocks, ETFs, budget, brokerage, net worth (NOT tax filing)"
  taxes:
    chat_id: "000000000000000000@g.us"
    description: "Tax filing 2026: IRS, W-2, 1040, deductions, TurboTax, estimated payments"

# Privacy guardrail (adapter-enforced, overrides everything): presses touching these
# stay in intake and the agent answers there. The LLM cannot override this.
sensitive_gate:
  - password
  - passphrase
  - api key
  - apikey
  - seed phrase
  - seedphrase
  - social security
  - ssn
  - account number
  - routing number
  - wire
  - blood pressure
  - cholesterol
  - prescription
  - medication
  - insulin
  - glucose
  - biopsy
  - mri
  - doctor
  - dermatologist
  - cardiologist
  - symptoms
  - diagnosis
  - rash
