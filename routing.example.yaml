# WhatsApp group directory for pebble presses + the `wa` CLI.
# Copy to routing.yaml (git-ignored) and fill in your own group JIDs.
# Read FRESH on every use - edits take effect immediately, no restart.
# The LLM sees aliases + descriptions only; JIDs never enter a prompt.
# The JIDs below are fictional placeholders.

intake_chat_id: "100000000000000000@g.us"

routes:
  household:
    chat_id: "100000000000000011@g.us"
    description: "Home: groceries, repairs, chores, appliances, utilities"
  garden:
    chat_id: "100000000000000012@g.us"
    description: "Garden: plants, seeds, watering schedule, tools"
  travel:
    chat_id: "100000000000000013@g.us"
    description: "Trips: flights, hotels, packing lists, itineraries"
  finance:
    chat_id: "100000000000000014@g.us"
    description: "Money: budget, savings, investing, bills"

# Privacy guardrail (adapter-enforced, overrides everything): presses touching these
# stay in intake and the agent answers there. The LLM cannot override this.
sensitive_gate:
  - password
  - passphrase
  - api key
  - apikey
  - seed phrase
  - seedphrase
  - social security
  - ssn
  - account number
  - routing number
  - wire
  - blood pressure
  - cholesterol
  - prescription
  - medication
  - insulin
  - glucose
  - biopsy
  - mri
  - doctor
  - dermatologist
  - cardiologist
  - symptoms
  - diagnosis
  - rash
